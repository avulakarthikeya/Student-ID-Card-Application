
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student ID Card Application Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <header>
        <h1>Student ID Card Application</h1>
        <p>College Student Identity Card Registration</p>
    </header>

    <form action="#" method="post" enctype="multipart/form-data">

        <h2>Personal Information</h2>

        <div class="form-grid">

            <div class="form-group">
                <label for="studentid">Student ID *</label>
                <input type="text" id="studentid"
                    name="studentid" placeholder="Enter Student ID"
                    required>
            </div>

            <div class="form-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name" name="name"
                    placeholder="Enter Full Name"
                    minlength="3" required>
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth *</label>
                <input type="date" id="dob" name="dob" required>
            </div>

            <div class="form-group">
                <label for="gender">Gender *</label>
                <select id="gender" name="gender" required>
                    <option value="">Select Gender</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email"
                    placeholder="example@gmail.com" required>
            </div>

            <div class="form-group">
                <label for="phone">Mobile Number *</label>
                <input type="tel" id="phone" name="phone"
                    placeholder="10-digit mobile number"
                    pattern="[0-9]{10}" required>
            </div>

        </div>

        <h2>Academic Information</h2>

        <div class="form-grid">

            <div class="form-group">
                <label for="department">Department *</label>
                <select id="department" name="department" required>
                    <option value="">Select Department</option>
                    <option>Computer Science</option>
                    <option>Information Technology</option>
                    <option>Commerce</option>
                    <option>Business Administration</option>
                    <option>Mathematics</option>
                    <option>English</option>
                </select>
            </div>

            <div class="form-group">
                <label for="year">Academic Year *</label>
                <select id="year" name="year" required>
                    <option value="">Select Year</option>
                    <option>First Year</option>
                    <option>Second Year</option>
                    <option>Third Year</option>
                    <option>Fourth Year</option>
                </select>
            </div>

            <div class="form-group">
                <label for="semester">Semester *</label>
                <select id="semester" name="semester" required>
                    <option value="">Select Semester</option>
                    <option>Semester 1</option>
                    <option>Semester 2</option>
                    <option>Semester 3</option>
                    <option>Semester 4</option>
                    <option>Semester 5</option>
                    <option>Semester 6</option>
                    <option>Semester 7</option>
                    <option>Semester 8</option>
                </select>
            </div>

            <div class="form-group">
                <label for="blood">Blood Group</label>
                <select id="blood" name="blood">
                    <option value="">Select Blood Group</option>
                    <option>A+</option>
                    <option>A-</option>
                    <option>B+</option>
                    <option>B-</option>
                    <option>O+</option>
                    <option>O-</option>
                    <option>AB+</option>
                    <option>AB-</option>
                </select>
            </div>

        </div>

        <h2>Address & Photograph</h2>

        <div class="form-grid">

            <div class="form-group full-width">
                <label for="address">Residential Address *</label>
                <textarea id="address" name="address"
                    rows="3" placeholder="Enter your full address"
                    required minlength="10"></textarea>
            </div>

            <div class="form-group full-width">
                <label for="photo">Upload Student Photograph *</label>
                <input type="file" id="photo" name="photo"
                    accept="image/png, image/jpeg" required>
                <small>Upload JPG or PNG image only.</small>
            </div>

        </div>

        <div class="declaration">
            <input type="checkbox" id="agree" required>
            <label for="agree">
                I declare that the information provided is correct.
            </label>
        </div>

        <div class="buttons">
            <button type="submit">Submit Application</button>
            <button type="reset" class="reset">Reset Form</button>
        </div>

    </form>

    <footer>
        © 2026 Student ID Card Application Portal
    </footer>

</div>

</body>
</html>
